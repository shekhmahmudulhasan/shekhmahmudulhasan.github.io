<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coming Soon</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;

      background:
        radial-gradient(circle at top left, #243b55 0%, transparent 35%),
        radial-gradient(circle at bottom right, #141e30 0%, transparent 40%),
        linear-gradient(135deg, #0f172a, #111827);
    }

    .container {
      width: 100%;
      max-width: 760px;
      padding: 40px 20px;
      text-align: center;
    }

    /* Logo */
    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;

      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);

      font-size: 32px;
      color: #ffffff;

      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    /* Small Label */
    .label {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 15px;

      border-radius: 50px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);

      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Heading */
    h1 {
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 22px;
    }

    h1 span {
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Description */
    .description {
      max-width: 600px;
      margin: 0 auto 32px;

      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.8;
    }

    /* Contact */
    .contact {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;

      margin-bottom: 28px;
    }

    .email {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 13px 20px;

      color: #ffffff;
      text-decoration: none;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;

      transition: 0.3s ease;
    }

    .email:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }

    /* Social Icons */
    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .socials a {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;
      text-decoration: none;

      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);

      transition: 0.3s ease;
    }

    .socials a:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.18);
    }

    /* Footer */
    footer {
      margin-top: 45px;
      color: #64748b;
      font-size: 13px;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .container {
        padding: 30px 18px;
      }

      .logo {
        width: 75px;
        height: 75px;
        border-radius: 20px;
      }

      h1 {
        letter-spacing: -1px;
      }

      .description {
        font-size: 15px;
      }

      .email {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Logo Placeholder -->
    <div class="logo">
      <i class="fa-solid fa-rocket"></i>
    </div>

    <div class="label">
      Coming Soon
    </div>

    <!-- Main Heading -->
    <h1>
      Something <span>Great</span><br>
      Is Coming
    </h1>

    <!-- Message -->
    <p class="description">
      We’re working hard behind the scenes to bring you a fresh
      and amazing experience. Our new website will be launching soon.
      Stay tuned!
    </p>

    <!-- Contact -->
    <div class="contact">
      <a href="mailto:hello@example.com" class="email">
        <i class="fa-solid fa-envelope"></i>
        hello@example.com
      </a>
    </div>

    <!-- Social Media -->
    <div class="socials">

      <a href="#" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>

      <a href="#" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a href="#" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>

      <a href="#" aria-label="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>

    </div>

    <footer>
      © 2026 Your Website. All rights reserved.
    </footer>

  </main>

</body>
</html>
