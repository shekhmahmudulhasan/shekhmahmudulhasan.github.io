<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Shekh Mahmudul Hasan — Imam, Khateeb, Scholar & Mudabbir">
<meta name="author" content="Shekh Mahmudul Hasan">

<title>Shekh Mahmudul Hasan | Shekh.com.bd</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --green:#075d46;
  --deep:#004b39;
  --dark:#12352b;
  --gold:#b9964f;
  --cream:#f7f6f0;
  --soft:#eef4f0;
  --line:#dfe6e1;
  --text:#1c2823;
  --muted:#68746f;
  --white:#fff;
  --max:1180px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f7f8f5;
  color:var(--text);
  font-family:"Hind Siliguri",sans-serif;
  line-height:1.55;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

.container{
  width:min(94%,var(--max));
  margin:auto;
}


/* =========================
   NAVBAR
========================= */

.navbar{
  height:64px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #e7eae8;
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(10px);
}

.nav-inner{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-family:"Noto Serif Bengali",serif;
  font-weight:700;
  color:#1c2d26;
}

.logo-symbol{
  width:32px;
  height:32px;
  border:2px solid var(--green);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--green);
  font-size:17px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:29px;
  font-size:13px;
  font-weight:600;
}

.nav-links a{
  padding:21px 0;
  position:relative;
}

.nav-links a:first-child:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  height:2px;
  background:var(--green);
}

.connect{
  color:#fff!important;
  background:var(--green);
  padding:9px 16px!important;
  border-radius:9px;
  box-shadow:0 4px 12px rgba(7,93,70,.16);
}

.mobile-toggle{
  display:none;
  border:0;
  background:none;
  font-size:22px;
  color:var(--green);
  cursor:pointer;
}


/* =========================
   HERO
========================= */

.hero{
  min-height:300px;
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #fbfaf5 0%,
      #fbfaf5 48%,
      rgba(251,250,245,.88) 62%,
      rgba(251,250,245,.10) 100%
    ),
    url("https://images.unsplash.com/photo-1519817650390-64a93db51149?auto=format&fit=crop&w=1500&q=85")
    right center/cover no-repeat;
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.23;

  background-image:
    radial-gradient(#b79b5e 1px,transparent 1px);

  background-size:34px 34px;

  mask-image:
    linear-gradient(
      90deg,
      black 0%,
      transparent 72%
    );
}

.hero-inner{
  min-height:300px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  position:relative;
}

.hero-content{
  text-align:center;
  max-width:610px;
  margin-left:0;
  padding:22px 0;
}

.profile-photo{
  width:112px;
  height:112px;
  border-radius:50%;
  object-fit:cover;
  object-position:center top;
  margin:0 auto 9px;

  border:4px solid var(--gold);

  box-shadow:
    0 5px 20px rgba(0,0,0,.12);

  background:#dcebe4;
}

.hero h1{
  font-family:"Noto Serif Bengali",serif;
  font-size:31px;
  line-height:1.2;
  margin:0;
  color:#132d24;
}

.role{
  font-size:16px;
  color:#9a7840;
  font-weight:600;
  margin:3px 0 14px;
}

.hero-actions{
  display:flex;
  justify-content:center;
  gap:9px;
}

.hero-btn{
  width:92px;
  height:49px;
  border:1px solid #e0e4e1;
  border-radius:8px;
  background:#fff;

  box-shadow:
    0 3px 10px rgba(0,0,0,.08);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-size:11px;
  font-weight:600;
}

.hero-btn b{
  font-size:18px;
  color:var(--green);
  line-height:1;
}

.hero-ornament{
  position:absolute;
  left:48%;
  top:20px;
  color:rgba(185,150,79,.28);
  font-size:28px;
}


/* =========================
   QUOTE
========================= */

.quote{
  margin-top:-1px;
  background:#fff;
  border:1px solid #e4e4df;
  border-radius:9px;
  min-height:105px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.07);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  position:relative;
  overflow:hidden;
}

.quote:before,
.quote:after{
  content:"❧";
  position:absolute;
  color:#b59a5c;
  font-size:55px;
  opacity:.45;
}

.quote:before{
  left:28px;
  transform:rotate(180deg);
}

.quote:after{
  right:28px;
}

.quote-inner{
  padding:17px 100px;
}

.quote-arabic{
  font-family:serif;
  font-size:27px;
  direction:rtl;
  color:#1d3029;
}

.quote-bn{
  font-size:16px;
  font-weight:600;
}

.quote-ref{
  font-size:11px;
  color:#8b8d88;
  margin-top:1px;
}


/* =========================
   COMMON SECTION
========================= */

.section{
  padding:26px 0;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:16px;

  font-family:"Noto Serif Bengali",serif;
  font-size:20px;
  color:#18362c;
}

.section-title:before,
.section-title:after{
  content:"";
  height:1px;
  width:30px;
  background:#aac3b8;
}

.section-title .round{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--green);
  color:#fff;
  font-family:sans-serif;
  font-size:13px;
}


/* =========================
   ABOUT
========================= */

.about-grid{
  display:grid;
  grid-template-columns:1.45fr .85fr;
  gap:26px;
  align-items:center;
}

.about-text{
  padding-left:12px;
}

.about-label{
  font-weight:700;
  font-size:17px;
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:8px;
}

.about-label span{
  width:27px;
  height:27px;
  background:var(--green);
  color:#fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
}

.about-text p{
  font-size:13px;
  color:#4f5d57;
  margin:0 0 9px;
}

.read-more{
  display:inline-flex;
  margin-top:3px;
  background:var(--green);
  color:#fff;
  border-radius:7px;
  padding:8px 15px;
  font-size:11px;
  font-weight:600;
}

.quick-info{
  background:#fff;
  border:1px solid #e4e7e5;
  border-radius:9px;
  padding:14px 18px;

  box-shadow:
    0 3px 11px rgba(0,0,0,.05);
}

.role-panel{
  padding:16px;
}

.role-heading{
  font-family:"Noto Serif Bengali",serif;
  font-size:15px;
  font-weight:700;
  color:#17382d;
  margin-bottom:9px;
}

.role-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:11px;
}

.role-tags span{
  background:#edf5f1;
  color:var(--green);
  border:1px solid #d8e6df;
  border-radius:20px;
  padding:4px 9px;
  font-size:10px;
  font-weight:600;
}

.panel-actions{
  display:grid;
  gap:7px;
}

.panel-action{
  display:grid;
  grid-template-columns:29px 1fr 15px;
  gap:8px;
  align-items:center;

  background:#f8faf8;
  border:1px solid #e4ebe7;
  border-radius:7px;
  padding:8px 9px;
}

.panel-action:hover{
  border-color:#b9d0c6;
  background:#f2f8f4;
}

.action-icon{
  width:27px;
  height:27px;
  border-radius:7px;
  background:var(--green);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:12px;
}

.panel-action b{
  display:block;
  font-size:10px;
  color:#1d3d32;
}

.panel-action small{
  display:block;
  color:#7b8580;
  font-size:8px;
  margin-top:1px;
}

.panel-action strong{
  color:var(--green);
  font-size:15px;
}


/* =========================
   BAYAN / ARTICLES
========================= */

.bayan-section{
  background:#edf4f0;
}

.bayan-layout{
  display:block;
}

.video-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.video-item{
  display:grid;
  grid-template-columns:96px 1fr;
  gap:10px;
  align-items:center;

  background:#fff;
  padding:7px;
  border-radius:8px;
  border:1px solid #e0e8e3;
}

.thumb{
  height:58px;
  border-radius:7px;
  overflow:hidden;
  position:relative;
  background:#ddd;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  width:30px;
  height:30px;

  border-radius:50%;
  background:rgba(255,255,255,.95);

  display:grid;
  place-items:center;

  color:var(--green);
  font-size:11px;
  padding-left:2px;
}

.video-item h4{
  margin:0;
  font-size:12px;
  line-height:1.35;
}

.video-item small{
  color:#7a837f;
  font-size:9px;
}

.watch{
  display:inline-block;
  background:var(--green);
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  font-size:10px;
}


/* =========================
   ACTIVITIES
========================= */

.activities{
  background:linear-gradient(120deg,#00543e,#00684d);
  color:#fff;
  padding:24px 0;
}

.activity-title{
  color:#fff;
  margin-bottom:17px;
}

.activity-title:before,
.activity-title:after{
  background:rgba(255,255,255,.3);
}

.activity-cards{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px;
}

.activity{
  background:rgba(255,255,255,.97);
  color:#18362c;
  border-radius:8px;
  padding:12px 6px;
  text-align:center;
  min-height:126px;
}

.activity .circle{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--green);
  color:#e8d09a;
  display:grid;
  place-items:center;
  margin:0 auto 7px;
  font-size:19px;
}

.activity h3{
  font-size:11px;
  margin:0 0 4px;
}

.activity p{
  font-size:8px;
  color:#69736e;
  line-height:1.35;
  margin:0;
}

.view-all{
  display:block;
  width:max-content;
  margin:10px auto 0;
  background:#fff;
  color:var(--green);
  padding:5px 11px;
  border-radius:6px;
  font-size:9px;
}


/* =========================
   GALLERY
========================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:9px;
}

.gallery-item{
  height:100px;
  border-radius:8px;
  overflow:hidden;
  position:relative;
  background:#ddd;
}

.gallery-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.gallery-item.video:after{
  content:"▶";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  width:34px;
  height:34px;
  border-radius:50%;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.9);
  color:var(--green);
  font-size:12px;
}


/* =========================
   SOCIAL
========================= */

.social-section{
  background:#eef0eb;
}

.socials{
  display:flex;
  justify-content:center;
  gap:48px;
  flex-wrap:wrap;
}

.social{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  font-weight:600;
}

.social-icon{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:700;
}

.fb{
  background:#1877f2;
}

.yt{
  background:#e62117;
}

.tg{
  background:#2aabee;
}

.wa{
  background:#20c66b;
}

.ig{
  background:linear-gradient(
    135deg,
    #f9ce34,
    #ee2a7b,
    #6228d7
  );
}


/* =========================
   CONTACT
========================= */

.contact{
  background:#fff;
  padding:28px 0;
}

.contact-grid{
  display:grid;
  grid-template-columns:1.15fr .65fr .85fr;
  gap:24px;
  align-items:center;
}

.contact-info h2{
  font-family:"Noto Serif Bengali",serif;
  font-size:21px;
  margin:0 0 5px;
}

.contact-info>p{
  font-size:11px;
  color:#66716c;
  margin:0 0 13px;
}

.contact-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 18px;
}

.detail{
  font-size:10px;
  color:#65706b;
}

.detail b{
  display:block;
  color:#234137;
  margin-bottom:1px;
}


/* =========================
   QR
========================= */

.qr{
  background:#fff;
  border:1px solid #e2e5e2;
  border-radius:8px;
  padding:11px;
  text-align:center;

  box-shadow:
    0 3px 10px rgba(0,0,0,.06);
}

.qr-code{
  width:100px;
  height:100px;
  margin:auto;

  background:
    linear-gradient(
      90deg,
      #111 10px,
      transparent 10px 20px,
      #111 20px 27px,
      transparent 27px 34px,
      #111 34px 45px,
      transparent 45px
    ),
    linear-gradient(
      #111 10px,
      transparent 10px 18px,
      #111 18px 25px,
      transparent 25px 33px,
      #111 33px 45px,
      transparent 45px
    ),
    repeating-linear-gradient(
      45deg,
      #111 0 3px,
      #fff 3px 7px
    );

  border:7px solid #fff;

  box-shadow:
    inset 0 0 0 2px #111;
}

.qr small{
  font-size:9px;
  color:#6e7772;
}


/* =========================
   DUA
========================= */

.dua{
  min-height:145px;
  border-radius:9px;

  background:
    linear-gradient(
      145deg,
      #00533e,
      #00674c
    );

  color:#fff;

  display:grid;
  place-items:center;
  text-align:center;

  padding:20px;
  position:relative;
  overflow:hidden;
}

.dua:before,
.dua:after{
  content:"";
  position:absolute;
  border:1px solid rgba(220,198,135,.35);
  border-radius:50%;
}

.dua:before{
  width:190px;
  height:190px;
}

.dua:after{
  width:140px;
  height:140px;
}

.dua p{
  position:relative;
  font-family:serif;
  font-size:15px;
  direction:rtl;
}

.dua small{
  display:block;
  font-family:"Hind Siliguri";
  font-size:9px;
  direction:ltr;
  color:#dce9e3;
}


/* =========================
   FOOTER
========================= */

footer{
  background:#063e30;
  color:#c9d9d3;
  font-size:9px;
}

.footer-inner{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.footer-links{
  display:flex;
  gap:18px;
}

.footer-brand{
  font-size:10px;
}


/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;

  background:rgba(9,34,26,.62);
  backdrop-filter:blur(5px);

  display:none;
  align-items:center;
  justify-content:center;

  padding:18px;
  z-index:9999;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;

  background:#fff;

  border:1px solid #e2e9e5;
  border-radius:18px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.25);

  position:relative;
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;

  background:#fff;
  border-bottom:1px solid #edf1ef;

  padding:18px 20px 14px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-head h3{
  margin:0;
  color:#17382d;

  font-family:"Noto Serif Bengali",serif;
  font-size:20px;
}

.modal-head p{
  margin:4px 0 0;
  color:#7b8580;
  font-size:11px;
}

.close-modal{
  border:0;
  background:#edf4f0;
  color:var(--green);

  width:34px;
  height:34px;

  border-radius:50%;

  font-size:20px;
  cursor:pointer;
}

.form-body{
  padding:18px 20px 22px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:11px;
  font-weight:700;
  color:#29483d;
}

.form-group label .req{
  color:#b45b4d;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #dce5e0;

  background:#fbfdfc;

  border-radius:9px;

  padding:10px 11px;

  font-family:inherit;
  font-size:12px;
  color:#263d35;

  outline:none;
  transition:.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#8fb4a4;

  box-shadow:
    0 0 0 3px rgba(48,105,82,.08);

  background:#fff;
}

.form-group textarea{
  min-height:105px;
  resize:vertical;
}

.form-note{
  margin:0 0 14px;

  padding:9px 11px;

  background:#f2f8f5;
  border:1px solid #dcebe3;
  border-radius:8px;

  color:#597067;
  font-size:10px;
  line-height:1.6;
}

.form-actions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
  margin-top:16px;
}

.form-btn{
  border:0;
  border-radius:8px;

  padding:10px 17px;

  font-family:inherit;
  font-size:11px;
  font-weight:700;

  cursor:pointer;
}

.form-btn.cancel{
  background:#edf1ef;
  color:#53645d;
}

.form-btn.submit{
  background:var(--green);
  color:#fff;
}

.form-btn.submit:hover{
  background:#244f3e;
}


/* =========================
   ANIMATION
========================= */

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.hero-content,
.quote,
.about-grid,
.bayan-layout,
.activity-cards,
.gallery,
.socials,
.contact-grid{
  animation:rise .65s ease both;
}


/* =========================
   TABLET
========================= */

@media(max-width:800px){

  .navbar,
  .nav-inner{
    height:58px;
  }

  .nav-links{
    display:none;
  }

  .mobile-toggle{
    display:block;
  }

  .hero{
    min-height:500px;

    background:
      linear-gradient(
        180deg,
        rgba(251,250,245,.96) 0%,
        rgba(251,250,245,.90) 57%,
        rgba(251,250,245,.35) 100%
      ),
      url("https://images.unsplash.com/photo-1519817650390-64a93db51149?auto=format&fit=crop&w=1000&q=80")
      center/cover;
  }

  .hero-inner{
    min-height:500px;
    display:block;
    padding-top:30px;
  }

  .hero-content{
    padding-top:15px;
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .profile-photo{
    margin-left:auto;
    margin-right:auto;
  }

  .hero h1{
    font-size:28px;
