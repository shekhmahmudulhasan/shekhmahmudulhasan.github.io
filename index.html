<style>

:root{
  --green:#075d46;
  --deep:#004b39;
  --dark:#12352b;
  --gold:#b9964f;
  --cream:#f7f6f0;
  --soft:#eef4f0;
  --line:#dfe6e1;
  --text:#1c2823;
  --muted:#68746f;
  --white:#fff;
  --max:1180px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f7f8f5;
  color:var(--text);
  font-family:"Hind Siliguri",sans-serif;
  line-height:1.55;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

.container{
  width:min(94%,var(--max));
  margin:auto;
}


/* =========================
   NAVBAR
========================= */

.navbar{
  height:64px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #e7eae8;
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(10px);
}

.nav-inner{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-family:"Noto Serif Bengali",serif;
  font-weight:700;
  color:#1c2d26;
}

.logo-symbol{
  width:32px;
  height:32px;
  border:2px solid var(--green);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--green);
  font-size:17px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:29px;
  font-size:13px;
  font-weight:600;
}

.nav-links a{
  padding:21px 0;
  position:relative;
}

.nav-links a:first-child:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  height:2px;
  background:var(--green);
}

.connect{
  color:#fff!important;
  background:var(--green);
  padding:9px 16px!important;
  border-radius:9px;
  box-shadow:0 4px 12px rgba(7,93,70,.16);
}

.mobile-toggle{
  display:none;
  border:0;
  background:none;
  font-size:22px;
  color:var(--green);
  cursor:pointer;
}


/* =========================
   HERO
========================= */

.hero{
  min-height:300px;
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #fbfaf5 0%,
      #fbfaf5 48%,
      rgba(251,250,245,.88) 62%,
      rgba(251,250,245,.10) 100%
    ),
    url("https://images.unsplash.com/photo-1519817650390-64a93db51149?auto=format&fit=crop&w=1500&q=85")
    right center/cover no-repeat;
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.23;

  background-image:
    radial-gradient(#b79b5e 1px,transparent 1px);

  background-size:34px 34px;

  mask-image:
    linear-gradient(90deg,black 0%,transparent 72%);
}

.hero-inner{
  min-height:300px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  position:relative;
}

.hero-content{
  text-align:center;
  max-width:610px;
  margin-left:0;
  padding:22px 0;
}

.profile-photo{
  width:112px;
  height:112px;
  border-radius:50%;
  object-fit:cover;
  object-position:center top;
  margin:0 auto 9px;

  border:4px solid var(--gold);

  box-shadow:
    0 5px 20px rgba(0,0,0,.12);

  background:#dcebe4;
}

.hero h1{
  font-family:"Noto Serif Bengali",serif;
  font-size:31px;
  line-height:1.2;
  margin:0;
  color:#132d24;
}

.role{
  font-size:16px;
  color:#9a7840;
  font-weight:600;
  margin:3px 0 14px;
}

.hero-actions{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
}

.hero-btn{
  width:92px;
  height:49px;

  border:1px solid #e0e4e1;
  border-radius:8px;
  background:#fff;

  box-shadow:
    0 3px 10px rgba(0,0,0,.08);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-size:11px;
  font-weight:600;
}

.hero-btn b{
  font-size:18px;
  color:var(--green);
  line-height:1;
}

.hero-ornament{
  position:absolute;
  left:48%;
  top:20px;
  color:rgba(185,150,79,.28);
  font-size:28px;
}


/* =========================
   QUOTE
========================= */

.quote{
  margin-top:-1px;
  background:#fff;
  border:1px solid #e4e4df;
  border-radius:9px;
  min-height:105px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.07);

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  position:relative;
  overflow:hidden;
}

.quote:before,
.quote:after{
  content:"❧";
  position:absolute;
  color:#b59a5c;
  font-size:55px;
  opacity:.45;
}

.quote:before{
  left:28px;
  transform:rotate(180deg);
}

.quote:after{
  right:28px;
}

.quote-inner{
  padding:17px 100px;
}

.quote-arabic{
  font-family:serif;
  font-size:27px;
  direction:rtl;
  color:#1d3029;
}

.quote-bn{
  font-size:16px;
  font-weight:600;
}

.quote-ref{
  font-size:11px;
  color:#8b8d88;
  margin-top:1px;
}


/* =========================
   COMMON SECTION
========================= */

.section{
  padding:26px 0;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:16px;

  font-family:"Noto Serif Bengali",serif;
  font-size:20px;
  color:#18362c;
}

.section-title:before,
.section-title:after{
  content:"";
  height:1px;
  width:30px;
  background:#aac3b8;
}

.section-title .round{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--green);
  color:#fff;
  font-family:sans-serif;
  font-size:13px;
}


/* =========================
   ABOUT
========================= */

.about-grid{
  display:grid;
  grid-template-columns:1.45fr .85fr;
  gap:26px;
  align-items:center;
}

.about-text{
  padding-left:12px;
}

.about-label{
  font-weight:700;
  font-size:17px;
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:8px;
}

.about-label span{
  width:27px;
  height:27px;
  background:var(--green);
  color:#fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
}

.about-text p{
  font-size:13px;
  color:#4f5d57;
  margin:0 0 9px;
}
